<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow | Task List</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="animate-fade-in">
  <!-- Header & Navigation -->
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">
        <i data-lucide="check-square" style="color: #6366f1;"></i>
        TaskFlow
      </a>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="add-task.html">Add Task</a></li>
          <li><a href="task-list.html" class="active">Task List</a></li>
          <li><a href="task-detail.html">Task Detail</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <!-- Main Content Area -->
  <main>
    <div class="card">
      <div class="filters-bar">
        <h2>Your Tasks</h2>
        <div class="filter-buttons">
          <button class="filter-btn active" id="filter-all">All</button>
          <button class="filter-btn" id="filter-pending">Pending</button>
          <button class="filter-btn" id="filter-completed">Completed</button>
        </div>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Due Date</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tasks-table-body">
            <!-- Dynamic Rows go here -->
          </tbody>
        </table>
      </div>
    </div>
  </main>
  <footer>
    <p>&copy; 2026 TaskFlow DevOps Team. Built with Premium HTML/CSS/JS containerized on Nginx.</p>
  </footer>
  <script>
    let currentFilter = 'all';
    function renderTasks() {
      const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
      const tbody = document.getElementById('tasks-table-body');
      tbody.innerHTML = '';
      const filteredTasks = tasks.filter(task => {
        if (currentFilter === 'pending') return task.status === 'pending';
        if (currentFilter === 'completed') return task.status === 'completed';
        return true;
      });
      if (filteredTasks.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" style="text-align: center; color: var(--text-muted); padding: 2.5rem 0;">
              No tasks found. Click <a href="add-task.html" style="color: var(--primary);">Add Task</a> to create one!
            </td>
          </tr>
        `;
        return;
      }
      filteredTasks.forEach(task => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-weight: 500;">${task.title}</td>
          <td>${task.dueDate}</td>
          <td><span class="badge badge-${task.priority}">${task.priority}</span></td>
          <td><span class="badge badge-${task.status}">${task.status}</span></td>
          <td>
            <a href="task-detail.html?id=${task.id}" class="btn btn-secondary" style="padding: 0.25rem 0.75rem; font-size: 0.8rem;">
              <i data-lucide="eye" style="width: 14px; height: 14px;"></i> View
            </a>
          </td>
        `;
        tbody.appendChild(tr);
      });
      lucide.createIcons();
    }
    // Filter Listeners
    document.getElementById('filter-all').addEventListener('click', (e) => setActiveFilter(e, 'all'));
    document.getElementById('filter-pending').addEventListener('click', (e) => setActiveFilter(e, 'pending'));
    document.getElementById('filter-completed').addEventListener('click', (e) => setActiveFilter(e, 'completed'));
    function setActiveFilter(e, filter) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      e.target.classList.add('active');
      currentFilter = filter;
      renderTasks();
    }
    // Initial render
    renderTasks();
  </script>
</body>
</html>
