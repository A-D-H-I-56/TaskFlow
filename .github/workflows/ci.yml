name: CI Pipeline - Build & Push Docker Image

on:
  pull_request:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1 - Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2 - Docker Login
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3 - Build Image
      # Step 4 - Tag Image (using commit SHA and latest tags)
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-cicd:v0.1 \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-cicd:${{ github.sha }} \
            .

      # Step 5 - Push Image
      - name: Push Docker Image (v0.1)
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-cicd:v01

      - name: Push Docker Image (Commit SHA)
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-cicd:${{ github.sha }}
